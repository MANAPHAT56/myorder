version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --skip-name-resolve  # 👈 เพิ่มบรรทัดนี้ลงไป!
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_database
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=rootpassword
    depends_on:
      - db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: php_backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:5173
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=my_database
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - COMPOSER_PROCESS_TIMEOUT=2000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://react_frontend:5173
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080  # หรือ http://php_backend:80
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: